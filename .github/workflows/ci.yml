name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: app — typecheck, lint, test, build, bundle budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check

  docs:
    name: docs — paths and heading fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/check-docs.test.mjs
      - run: node scripts/check-docs.mjs
